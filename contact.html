    <!-- Form validation and submission script -->
    <script>
        $(document).ready(function() {
            // Form submission handler
            $("#contactForm").submit(function(event) {
                event.preventDefault();
                
                // Basic validation
                var name = $("#name").val().trim();
                var email = $("#email").val().trim();
                var message = $("#message").val().trim();
                
                if (!name || !email || !message) {
                    $(".form-message").html('<div class="alert alert-danger">Please fill in all fields.</div>').slideDown();
                    return;
                }
                
                // Show loading indicator
                $("button[type=submit]").html('Sending... <i class="ri-loader-4-line"></i>');
                $("button[type=submit]").prop('disabled', true);
                
                // Get form data
                var formData = $(this).serialize();
                
                // Send AJAX request to PHP script
                $.ajax({
                    type: "POST",
                    url: "assets/php/form-process.php",
                    data: formData,
                    dataType: "json",
                    timeout: 10000, // 10 second timeout
                    success: function(response) {
                        if (!response.error) {
                            // Success message
                            $(".form-message").html('<div class="alert alert-success">' + response.message + '</div>').slideDown();
                            // Reset the form
                            $("#contactForm")[0].reset();
                        } else {
                            // Error message
                            $(".form-message").html('<div class="alert alert-danger">' + response.message + '</div>').slideDown();
                        }
                    },
                    error: function(xhr, status, error) {
                        // Detailed error message
                        var errorMessage = "Server error! ";
                        
                        if (status === "timeout") {
                            errorMessage += "The request timed out. ";
                        } else if (xhr.status) {
                            errorMessage += "HTTP Error: " + xhr.status + " " + xhr.statusText + ". ";
                        }
                        
                        errorMessage += "Please try again later or contact directly via email.";
                        
                        $(".form-message").html('<div class="alert alert-danger">' + errorMessage + '</div>').slideDown();
                        console.error("AJAX Error:", status, error, xhr);
                    },
                    complete: function() {
                        // Reset button text and enable it
                        $("button[type=submit]").html('Send Me Message <i class="ri-mail-line"></i>');
                        $("button[type=submit]").prop('disabled', false);
                    }
                });
            });
        });
    </script>
